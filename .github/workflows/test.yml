name: Test

on:
  push:
    branches: [main, 4.*, 5.*, 6.*]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/pom.xml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/pom.xml'

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn test -B
